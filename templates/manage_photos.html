<!DOCTYPE html>
<html>
<head>
    <link rel="icon" href="{{ url_for('static', filename='image/school logo.jpeg') }}">

    <title>Manage Photos</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f8ff;
            text-align: center;
        }

        h1 {
            color: #0b4da2;
        }

        .photo {
            display: inline-block;
            background: white;
            padding: 15px;
            margin: 15px;
            border-radius: 10px;
            box-shadow: 0 3px 10px #aaa;
        }

        img {
            width: 200px;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
        }

        .delete {
            display: block;
            margin-top: 10px;
            padding: 8px;
            background: #d9534f;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<h1>📸 Manage Photos</h1>

<a href="/dashboard">⬅ Back to Dashboard</a>

<br><br>

{% for photo in photos %}

<div class="photo">

    <img src="{{ url_for('static', filename='image/' + photo) }}">

    <p>{{ photo }}</p>

    <a class="delete"
       href="/delete-photo/{{ photo }}"
       onclick="return confirm('Are you sure you want to delete this photo?');">

        🗑️ Delete

    </a>

</div>

{% endfor %}

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <link rel="icon" href="{{ url_for('static', filename='image/school logo.jpeg') }}">

    <title>Admin Login</title>

    <style>
        body {
            font-family: Arial;
            background: #eaf4ff;
            text-align: center;
            padding-top: 100px;
        }

        .login-box {
            width: 350px;
            max-width: 90%;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        h2 {
            color: #0b4da2;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px;
            border: 1px solid #aaa;
            border-radius: 6px;
        }

        button {
            width: 95%;
            padding: 12px;
            background: #0b4da2;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #06356f;
        }

        .error {
            color: red;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h2>🏫 School Admin Login</h2>

    <form method="POST">

        <input
            type="text"
            name="username"
            placeholder="Username"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

</div>

</body>
</html>

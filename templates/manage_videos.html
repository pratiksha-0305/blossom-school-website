<!DOCTYPE html>
<html>
<head>
    <link rel="icon" href="{{ url_for('static', filename='image/school logo.jpeg') }}">

    <title>Manage Videos</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f8ff;
            text-align: center;
        }

        h1 {
            color: #0b4da2;
        }

        .video {
            display: inline-block;
            background: white;
            padding: 15px;
            margin: 15px;
            border-radius: 10px;
            box-shadow: 0 3px 10px #aaa;
        }

        video {
            width: 300px;
            max-width: 90%;
        }

        .delete {
            display: block;
            margin-top: 10px;
            padding: 8px;
            background: #d9534f;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<h1>🎥 Manage Videos</h1>

<a href="/dashboard">⬅ Back to Dashboard</a>

<br><br>

{% for video in videos %}

<div class="video">

    <video controls>
        <source src="{{ url_for('static', filename='video/' + video) }}"
                type="video/mp4">
    </video>

    <p>{{ video }}</p>

    <a class="delete"
       href="/delete-video/{{ video }}"
       onclick="return confirm('Are you sure you want to delete this video?');">

        🗑️ Delete

    </a>

</div>

{% endfor %}

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <link rel="icon" href="{{ url_for('static', filename='image/school logo.jpeg') }}">

    <title>Add Event Photo</title>
</head>

<body>

<h1>Add Event Photo</h1>

<form action="/add-photo" method="POST" enctype="multipart/form-data">

    <label>Event Name:</label>
    <input type="text" name="event_name"
           placeholder="Example: Yoga Day" required>

    <br><br>

    <label>Select Photo:</label>
    <input type="file" name="photo"
           accept="image/*" required>

    <br><br>

    <button type="submit">Upload Photo</button>

</form>

<br>

<a href="/dashboard">← Back to Dashboard</a>

</body>
</html>

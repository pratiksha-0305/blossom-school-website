<!DOCTYPE html>
<html>
<head>
    <link rel="icon" href="{{ url_for('static', filename='image/school logo.jpeg') }}">

    <title>Add Event Video</title>
</head>

<body>

<h1>🎥 Add Event Video</h1>

<form action="/add-video" method="POST" enctype="multipart/form-data">

    <label>Event Name:</label>
    <input type="text"
           name="event_name"
           placeholder="Example: Annual Function"
           required>

    <br><br>

    <label>Select Video:</label>
    <input type="file"
           name="video"
           accept="video/*"
           required>

    <br><br>

    <button type="submit">Upload Video</button>

</form>

<br>

<a href="/dashboard">← Back to Dashboard</a>

</body>
</html>
